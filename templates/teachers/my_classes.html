{% extends 'base/base.html' %}
{% block title %}My Classes{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">My Classes</h4>
<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
        <table class="table datatable">
            <thead><tr><th>Subject</th><th>Course</th><th>Actions</th></tr></thead>
            <tbody>{% for s in subjects %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.course.name }}</td>
                    <td>
                        <a href="{% url 'attendance_list' %}?subject={{ s.id }}" class="btn btn-sm btn-primary">Attendance</a>
                        <a href="{% url 'exam_list' %}?subject={{ s.id }}" class="btn btn-sm btn-success">Marks</a>
                    </td>
                </tr>{% empty %}<tr><td colspan="3" class="text-muted">No classes assigned.</td></tr>{% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
