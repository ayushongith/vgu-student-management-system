{% extends 'base/base.html' %}
{% block title %}Attendance Report{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Attendance Report</h4>
<form method="get" class="row g-3 mb-3">
    <div class="col-auto"><input type="date" name="from" class="form-control" value="{{ start_date }}"></div>
    <div class="col-auto"><input type="date" name="to" class="form-control" value="{{ end_date }}"></div>
    <div class="col-auto"><button type="submit" class="btn btn-primary">Filter</button></div>
</form>
<div class="row g-3">
    {% for r in report %}
    <div class="col-md-3">
        <div class="card stat-card shadow-sm">
            <div class="card-body text-center">
                <div class="stat-value">{{ r.count }}</div>
                <div class="stat-label">{{ r.status|title }}</div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
