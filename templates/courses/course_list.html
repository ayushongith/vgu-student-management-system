{% extends 'base/base.html' %}
{% block title %}Courses{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Courses</h4>
    <a href="{% url 'course_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Course</a>
</div>
<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
        <table class="table datatable">
            <thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Semester</th><th>Credits</th><th>Actions</th></tr></thead>
            <tbody>{% for c in courses %}
                <tr>
                    <td><span class="badge bg-secondary">{{ c.code }}</span></td>
                    <td>{{ c.name }}</td>
                    <td>{{ c.department.name }}</td>
                    <td>{{ c.semester }}</td>
                    <td>{{ c.credits }}</td>
                    <td>
                        <a href="{% url 'course_update' c.pk %}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'course_delete' c.pk %}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>{% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
