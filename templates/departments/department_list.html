{% extends 'base/base.html' %}
{% block title %}Departments{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Departments</h4>
    <a href="{% url 'department_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Department</a>
</div>
<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
        <table class="table datatable">
            <thead>
                <tr><th>Name</th><th>Code</th><th>Description</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for dept in departments %}
                <tr>
                    <td>{{ dept.name }}</td>
                    <td><span class="badge bg-secondary">{{ dept.code }}</span></td>
                    <td>{{ dept.description|truncatewords:15 }}</td>
                    <td>
                        <a href="{% url 'department_update' dept.pk %}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'department_delete' dept.pk %}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
