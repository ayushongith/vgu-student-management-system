{% extends 'base/base.html' %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3"><h5 class="mb-0">{{ title }}</h5></div>
            <div class="card-body">
                <form method="post">{% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'timetable_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
