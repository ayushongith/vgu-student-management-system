{% extends 'base/base.html' %}
{% block title %}Subjects{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Subjects</h4>
    <a href="{% url 'subject_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Subject</a>
</div>
<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
        <table class="table datatable">
            <thead><tr><th>Code</th><th>Name</th><th>Course</th><th>Teacher</th><th>Credits</th><th>Actions</th></tr></thead>
            <tbody>{% for s in subjects %}
                <tr>
                    <td><span class="badge bg-secondary">{{ s.code }}</span></td>
                    <td>{{ s.name }}</td>
                    <td>{{ s.course.name }}</td>
                    <td>{{ s.teacher.name|default:"--" }}</td>
                    <td>{{ s.credits }}</td>
                    <td>
                        <a href="{% url 'subject_update' s.pk %}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'subject_delete' s.pk %}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>{% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
